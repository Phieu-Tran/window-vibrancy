[package]
name = "window-vibrancy"
description = "Windows vibrancy effects — Mica, Mica Alt, Acrylic, Blur, rounded corners, and smart fallback."
authors = ["Phieu-Tran", "Tauri Programme within The Commons Conservancy"]
version = "0.8.0"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/Phieu-Tran/window-vibrancy"
keywords = ["vibrancy", "acrylic", "mica", "blur", "windows"]
categories = ["gui"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[dependencies]
raw-window-handle = "0.6"

[dev-dependencies]
tao = "0.34"
winit = "0.30"

[target.'cfg(target_os = "windows")'.dependencies]
windows-version = "0.1"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.60.0"
features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
]
